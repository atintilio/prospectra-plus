services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: prospectra-evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      - evolution_instances:/evolution/instances
    networks: [evolution-net]

  evolution-postgres:
    image: postgres:15
    container_name: prospectra-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [evolution-net]

  evolution-redis:
    image: redis:7-alpine
    container_name: prospectra-evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks: [evolution-net]

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  evolution-net:
    driver: bridge
